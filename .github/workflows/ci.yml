name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon
          POSTGRES_DB: salon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon -d salon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgres://salon:salon@localhost:5432/salon_test
      NODE_ENV: test
      SMS_PROVIDER: mock
      APP_URL: http://localhost:3000
      OWNER_SESSION_SECRET: ci-owner-secret-012345678901234567890123
      CUSTOMER_SESSION_SECRET: ci-customer-secret-012345678901234567890123
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_SALON_ID: ci-salon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify migrations
        run: npm run verify-migrations

      - name: Apply migrations
        run: node scripts/apply-migrations.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Build
        run: npm run build
