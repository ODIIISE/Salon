name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon
          POSTGRES_DB: salon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U salon -d salon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      POSTGRES_URL: postgres://salon:salon@127.0.0.1:5432/salon_test
      POSTGRES_PRISMA_URL: postgres://salon:salon@127.0.0.1:5432/salon_test
      POSTGRES_URL_NON_POOLING: postgres://salon:salon@127.0.0.1:5432/salon_test
      DATABASE_URL: postgres://salon:salon@127.0.0.1:5432/salon_test
      NODE_ENV: test
      SMS_PROVIDER: mock
      APP_URL: http://localhost:3000
      OWNER_SESSION_SECRET: ci-owner-secret-012345678901234567890123
      CUSTOMER_SESSION_SECRET: ci-customer-secret-012345678901234567890123
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_SALON_ID: ci-salon

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify PostgreSQL service
        run: |
          node -e "const net=require('node:net'); const s=net.createConnection({host:'127.0.0.1',port:5432}); s.setTimeout(5000); s.on('connect',()=>{console.log('PostgreSQL TCP connection OK');s.end()}); s.on('timeout',()=>{console.error('PostgreSQL connection timed out');s.destroy();process.exit(1)}); s.on('error',e=>{console.error(e);process.exit(1)})"

      - name: Verify migration files
        run: npm run verify-migrations

      - name: Apply migrations
        run: node scripts/apply-migrations.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
